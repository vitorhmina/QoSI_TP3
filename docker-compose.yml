name: qosi

# The VNF images (base, fw, cls, pol, mon) are only BUILT here; CORE runs the real containers.
# base sets what they all share, and fw/cls/pol/mon take it with "extends: base":
#   entrypoint ["true"]   -> "up" starts the container and it exits right away
#   network_mode: none    -> it needs no Docker network
# If a build fails with "network bridge not found", CORE deleted Docker's bridge (docker0):
# sudo systemctl restart docker, or rerun setup.sh, which handles it.

services:
  base:
    image: qosi-base
    build:
      context: ./vnfs/base
    entrypoint: ["true"]
    restart: "no"
    network_mode: none

  fw:
    extends: base
    image: qosi-fw
    build:
      context: ./vnfs/fw
      additional_contexts:
        qosi-base: "service:base"     # "FROM qosi-base" uses the base image built above

  cls:
    extends: base
    image: qosi-cls
    build:
      context: ./vnfs/cls
      additional_contexts:
        qosi-base: "service:base"

  pol:
    extends: base
    image: qosi-pol
    build:
      context: ./vnfs/pol
      additional_contexts:
        qosi-base: "service:base"

  mon:
    extends: base
    image: qosi-mon
    build:
      context: ./vnfs/mon
      additional_contexts:
        qosi-base: "service:base"

  prometheus:
    image: prom/prometheus
    network_mode: host                # reaches the VNFs over CORE's control network (172.16.0.0/24)
    volumes:
      - ./vnfs/mon/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    network_mode: host
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./vnfs/mon/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./vnfs/mon/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
